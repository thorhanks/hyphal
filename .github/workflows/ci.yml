# plan/TESTING.md §2. Tool versions come from mise.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: make check
      - if: runner.os == 'Linux'
        run: make crash

  e2e:
    strategy:
      fail-fast: false
      matrix:
        # Playwright 1.55 doesn't support Ubuntu 26.04, now ubuntu-latest.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e
      - run: make e2e
